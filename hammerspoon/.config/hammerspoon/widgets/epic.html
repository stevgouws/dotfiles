<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
	Desktop widget for an epic's timeline, shown by epic.lua. The Lua side fills in EPIC below with
	the tickets, estimation scale and days off read from Obsidian; everything else is worked out here.
	The numbers follow the Estimates section in the epic note, see the epic-tracking Claude skill.
-->
<style>
	__THEMES__
	* { box-sizing: border-box; }
	html, body { background: transparent; margin: 0; }
	body {
		/* The window is half the screen and the full height of it (see epic.lua); the card fills it. */
		height: 100vh;
		padding: 24px 8px 24px 24px;
		font: 21px/1.35 var(--font);
		color: var(--text);
		-webkit-user-select: none;
		cursor: default;
	}
	.card {
		height: 100%;
		padding: 24px 28px;
		border-radius: var(--radius);
		background: var(--card);
		border: 1px solid var(--edge);
		box-shadow: var(--shadow);
		overflow: hidden;
	}
	.content { display: flex; flex-direction: column; gap: 22px; }
	.title { font-weight: 600; color: var(--muted); }
	.big { font: 700 50px/1.15 var(--headline-font); letter-spacing: -0.02em; }
	.sub { color: var(--muted); }
	svg { display: block; }
	svg text { font-family: inherit; font-variant-numeric: tabular-nums; }
	.head { display: flex; justify-content: space-between; align-items: baseline; }
	.finish { font-size: 0.62em; color: var(--text); }
	.row { display: flex; justify-content: space-between; align-items: baseline; }
	.pill { font-weight: 600; font-variant-numeric: tabular-nums; }
	.stretch { padding-top: 20px; border-top: 1px solid var(--edge); }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
// Shows anything that goes wrong below on the card, so a bad note doesn't just leave it blank.
window.onerror = (message) => {
	document.getElementById("card").innerHTML = `<div class="title">Epic widget</div><div class="sub" style="margin-top:6px">${escape(String(message))}</div>`;
};

const EPIC = __DATA__;
document.body.dataset.style = EPIC.style || "glass";
if (EPIC.error) throw new Error(EPIC.error);
if (!EPIC.due) throw new Error("The epic note has no due property.");
// Lua's JSON encoder writes an empty list as {}.
for (const key of ["tickets", "daysOff"]) if (!Array.isArray(EPIC[key])) EPIC[key] = [];

const daysOff = new Set(EPIC.daysOff);
const due = parseDate(EPIC.due);
const today = parseDate(EPIC.today);

// A ticket is finished on my side once it's with QA.
const COMPLETE = new Set(["Ready for Testing", "In Testing", "Done"]);
const open = EPIC.tickets.filter((t) => !COMPLETE.has(t.status));
const must = open.filter((t) => !t.stretch);
const stretch = open.filter((t) => t.stretch);
const done = EPIC.tickets.filter((t) => COMPLETE.has(t.status) && !t.stretch);
const STAGES = {
	"Ready for review": { rank: 0, name: "In review" },
	"Waiting for review": { rank: 0, name: "In review" },
	"In Progress": { rank: 1, name: "In progress" },
};

const daysUntilDue = workingDaysUntil(due);
const epicDays = sum(must, "days");
const stretchDays = sum(stretch, "days");
// BAU is planned as one ticket of bau_points_per_week points a week, so it takes this much of each working day.
const bauPerDay = EPIC.bauDaysPerWeek / 5;
const bauDays = daysUntilDue * bauPerDay;
const spare = daysUntilDue - epicDays - bauDays;
const daysPerPoint = epicDays / sum(must, "points");
const pointsDone = sum(done, "points");
const pointsAll = pointsDone + sum(must, "points");

// Working day (counted from tomorrow) on which the must-haves, then the stretch goals, are done,
// giving each working day to the epic apart from its share of BAU.
const capacityPerDay = 1 - bauPerDay;
const mustFinish = epicDays / capacityPerDay;
const stretchFinish = (epicDays + stretchDays) / capacityPerDay;
const stretchSpare = spare - stretchDays;
const finish = dateOfWorkingDay(mustFinish);

const card = document.getElementById("card");
// The charts fill the card, which is as wide as the window epic.lua opens.
const chartWidth = card.clientWidth - 2 * parseFloat(getComputedStyle(card).paddingLeft);
const CHART_TEXT = 18;

// Drawn once to see how much height is left, then again with the burndown taking all of it.
draw(200);
draw(Math.max(140, 200 + spareHeight()));

function draw(burndownHeight) {
	card.innerHTML = `<div class="content">
		<div class="head"><span class="title">${escape(EPIC.title)}</span><span class="sub">due ${fmt(due)}</span></div>
		${summary()}
		${burndown(burndownHeight)}
		${stretchSummary()}
	</div>`;
}

/** The card's height not taken up by its content; below zero when the content doesn't fit. */
function spareHeight() {
	const style = getComputedStyle(card);
	const inner = card.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
	return inner - card.firstElementChild.offsetHeight;
}

function summary() {
	return `<div style="display:flex;align-items:center;gap:24px">
		${progressRing(pointsDone / pointsAll)}
		<div>
			<div class="big" style="color:${colour(spare)}">${verdict(spare)} <span class="finish">· done ${fmt(finish)}</span></div>
			<div class="sub">${versusDue()} · ${inPoints(spare)}</div>
			<div class="sub">${pointsDone}/${pointsAll} pts done · ${daysUntilDue} working days left</div>
		</div>
	</div>`;
}

function progressRing(fraction) {
	const r = 48, c = 2 * Math.PI * r;
	return svg(110, 110, `
		<circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--faint)" stroke-width="10"/>
		<circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--epic)" stroke-width="10" stroke-linecap="round"
			stroke-dasharray="${c * fraction} ${c}" transform="rotate(-90 55 55)"/>
		<text x="55" y="62" text-anchor="middle" fill="var(--text)" font-size="22" font-weight="700">${Math.round(fraction * 100)}%</text>`);
}

/** How many working days the must-haves finish before or after the due date. */
function versusDue() {
	const late = Math.ceil(mustFinish) - daysUntilDue;
	if (late === 0) return "on the due date";
	const days = `${Math.abs(late)} working day${Math.abs(late) === 1 ? "" : "s"}`;
	return late > 0 ? `${days} late` : `${days} early`;
}

/**
 * Work left over the coming working days, BAU included: the must-haves, the must-haves plus the
 * stretch goals, and the line the must-haves need to follow to finish by the due date.
 */
function burndown(H) {
	const W = chartWidth, fs = CHART_TEXT, pad = { l: 2 * fs, r: 8, t: 10, b: fs + 12 };
	const allDays = epicDays + stretchDays;
	const span = Math.ceil(Math.max(stretchFinish, daysUntilDue)) + 1;
	const x = (day) => pad.l + (day / span) * (W - pad.l - pad.r);
	const y = (days) => pad.t + (1 - days / Math.max(allDays, 0.01)) * (H - pad.t - pad.b);
	const path = (points) => points.map(([a, b], i) => `${i ? "L" : "M"}${x(a)},${y(b)}`).join("");
	const mustLine = path([[0, epicDays], [mustFinish, 0]]);
	const stretchLine = path([[0, allDays], [stretchFinish, 0]]);
	const needed = path([[0, epicDays], [daysUntilDue, 0]]);
	const dates = workingDates(today, span);
	const step = Math.max(1, Math.round(span / 8));
	const ticks = Array.from({ length: Math.ceil(span / step) }, (_, i) => i * step)
		.map((day) => `<text x="${x(day)}" y="${H - 4}" fill="var(--muted)" font-size="${fs}" text-anchor="middle">${day === 0 ? "today" : fmt(dates[day - 1])}</text>`)
		.join("");
	const gridLines = [0, 0.5, 1].map((f) => `
		<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(allDays * f)}" y2="${y(allDays * f)}" stroke="var(--faint)"/>
		<text x="${pad.l - 6}" y="${y(allDays * f) + fs / 3}" fill="var(--muted)" font-size="${fs}" text-anchor="end">${Math.round(allDays * f)}</text>`).join("");
	// A quarter of the way along its line, clear of the due date, above it, where the line falls away from the text.
	const label = (text, colour, finishDay, startDays) =>
		`<text x="${x(finishDay / 4) + 8}" y="${y((startDays * 3) / 4) - 8}" fill="${colour}" font-size="${fs}" font-weight="600">${text}</text>`;
	return svg(W, H, `
		<defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--epic)" stop-opacity=".35"/><stop offset="1" stop-color="var(--epic)" stop-opacity="0"/></linearGradient></defs>
		${gridLines}
		<rect x="${x(daysUntilDue)}" y="${pad.t}" width="${Math.max(0, x(span) - x(daysUntilDue))}" height="${H - pad.t - pad.b}" fill="var(--bad)" fill-opacity=".1"/>
		<path d="${mustLine} L${x(0)},${y(0)}Z" fill="url(#fill)"/>
		<path d="${needed}" stroke="var(--muted)" stroke-dasharray="4 4" fill="none"/>
		<path d="${stretchLine}" stroke="var(--bau)" stroke-width="2.5" fill="none"/>
		<path d="${mustLine}" stroke="var(--epic)" stroke-width="3" fill="none"/>
		<line x1="${x(daysUntilDue)}" x2="${x(daysUntilDue)}" y1="${pad.t}" y2="${H - pad.b}" stroke="var(--bad)" stroke-dasharray="3 3"/>
		<circle cx="${x(stretchFinish)}" cy="${y(0)}" r="5" fill="var(--bau)"/>
		<circle cx="${x(mustFinish)}" cy="${y(0)}" r="6" fill="${colour(spare)}"/>
		${label("with stretch goals", "var(--bau)", stretchFinish, allDays)}
		${label("must-haves", "var(--epic)", mustFinish, epicDays)}
		<text x="${x(daysUntilDue) - 12}" y="${y(0) - 12}" fill="var(--muted)" font-size="${fs}" font-weight="600" text-anchor="end">needed to hit due</text>
		${ticks}`);
}

function stretchSummary() {
	return `<div class="stretch row"><span class="sub">With stretch goals</span>
		<span class="pill" style="color:${colour(stretchSpare)}">${verdict(stretchSpare)} · done ${fmt(dateOfWorkingDay(stretchFinish))}</span></div>`;
}

/**
 * Today's figures for epic.lua to save in the history file. Today isn't counted as a working day
 * left, so pointsAhead below zero is also how many points would have to be done today to catch up.
 */
function snapshot() {
	const pointsAhead = daysPerPoint ? spare / daysPerPoint : null;
	// Doing this many points in a day keeps the epic as far ahead or short as it was.
	const pointsPerDay = daysPerPoint ? capacityPerDay / daysPerPoint : null;
	const pointsComplete = sum(EPIC.tickets.filter((t) => COMPLETE.has(t.status)), "points");
	return {
		date: EPIC.today,
		daysAhead: spare,
		pointsAhead,
		pointsComplete,
		pointsPerDay,
		mustPointsLeft: sum(must, "points"),
		// Including today, unlike daysUntilDue.
		workingDaysLeft: daysUntilDue + (isWorkingDay(today) ? 1 : 0),
		workingDay: isWorkingDay(today),
		catchUp: catchUp(),
	};
}

/**
 * The must-haves to finish today for the epic to start tomorrow on track: the fewest from the front
 * of the queue whose days cover the shortfall. The queue starts with the tickets in review, then
 * those in progress, as they're the closest to done, then the rest in work order. Empty when it's on
 * track already.
 */
function catchUp() {
	const queue = [...must].sort((a, b) =>
		stageOf(a).rank - stageOf(b).rank || (a.order ?? Infinity) - (b.order ?? Infinity) || a.key.localeCompare(b.key));
	const tickets = [];
	let shortfall = -spare;
	for (const t of queue) {
		if (r1(shortfall) <= 0) break;
		tickets.push({ key: t.key, title: t.title, points: t.points, stage: stageOf(t).name });
		shortfall -= t.days;
	}
	return tickets;
}

function stageOf(ticket) {
	return STAGES[ticket.status] ?? { rank: 2, name: "To do" };
}

function parseDate(iso) {
	const [y, m, d] = iso.split("-").map(Number);
	return new Date(y, m - 1, d);
}

function isoDate(date) {
	return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
}

/** Weekdays that aren't bank holidays or leave. */
function isWorkingDay(date) {
	return date.getDay() % 6 !== 0 && !daysOff.has(isoDate(date));
}

/** Working days from tomorrow up to and including `end`, so the rest of today isn't counted. */
function workingDaysUntil(end) {
	let count = 0;
	for (const day = new Date(today); ; ) {
		day.setDate(day.getDate() + 1);
		if (day > end) return count;
		if (isWorkingDay(day)) count++;
	}
}

/** The next `count` working days after `from`. */
function workingDates(from, count) {
	const dates = [];
	const day = new Date(from);
	while (dates.length < count) {
		day.setDate(day.getDate() + 1);
		if (isWorkingDay(day)) dates.push(new Date(day));
	}
	return dates;
}

/** The date of a fractional working day, e.g. 21.7 is partway through the 22nd working day from tomorrow. */
function dateOfWorkingDay(day) {
	return workingDates(today, Math.max(1, Math.ceil(day))).at(-1);
}

function sum(list, key) {
	return list.reduce((total, t) => total + (t[key] || 0), 0);
}

/** Rounds to one decimal place like the Estimates note; toFixed(2) first stops float noise (2.9500000001) rounding up. */
function r1(n) {
	return Math.round(Number(n.toFixed(2)) * 10) / 10;
}

function verdict(spareDays) {
	const rounded = r1(spareDays);
	if (rounded === 0) return "On target";
	return rounded > 0 ? `${rounded}d ahead` : `${-rounded}d short`;
}

/** Spare or missing days as points, at the average days per point of the must-haves left. */
function inPoints(spareDays) {
	if (r1(spareDays) === 0 || !daysPerPoint) return "on target";
	return spareDays > 0 ? `${Math.floor(spareDays / daysPerPoint)} pts spare` : `${Math.ceil(-spareDays / daysPerPoint)} pts over`;
}

/** Green from half a day ahead, amber down to two days short, red past that. */
function colour(spareDays) {
	if (spareDays >= 0.5) return "var(--good)";
	return spareDays > -2 ? "var(--warn)" : "var(--bad)";
}

function fmt(date) {
	return date.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
}

function svg(w, h, inner) {
	return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${inner}</svg>`;
}

function escape(text) {
	return text.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}
</script>
</body>
</html>
