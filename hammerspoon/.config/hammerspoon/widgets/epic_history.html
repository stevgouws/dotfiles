<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
	Desktop widget charting how many days ahead or short an epic was at the end of each working day,
	shown by epic_history.lua. The Lua side fills in HISTORY below from the file epic.lua writes.
-->
<style>
	__THEMES__
	* { box-sizing: border-box; }
	html, body { background: transparent; margin: 0; }
	body {
		/* The window is half the screen and the full height of it (see epic.lua); the card fills it. */
		height: 100vh;
		padding: 24px 24px 24px 8px;
		font: 21px/1.35 var(--font);
		color: var(--text);
		-webkit-user-select: none;
		cursor: default;
	}
	.card {
		height: 100%;
		padding: 24px 28px;
		border-radius: var(--radius);
		background: var(--card);
		border: 1px solid var(--edge);
		box-shadow: var(--shadow);
		overflow: hidden;
	}
	.content { display: flex; flex-direction: column; gap: 22px; }
	.title { font-weight: 600; color: var(--muted); }
	.big { font: 700 50px/1.15 var(--headline-font); letter-spacing: -0.02em; }
	.sub { color: var(--muted); }
	svg { display: block; }
	svg text { font-family: inherit; font-variant-numeric: tabular-nums; }
	.points { font: 600 0.62em var(--font); letter-spacing: 0; color: var(--text); margin-left: 10px; }
	.rows { display: flex; flex-direction: column; gap: 10px; }
	.today { display: flex; align-items: center; gap: 14px; }
	.today .bar { flex: 1; height: 10px; border-radius: 5px; background: var(--faint); overflow: hidden; }
	.today .bar i { display: block; height: 100%; background: var(--epic); }
	.today .label { width: 7em; }
	.target ul { margin: 4px 0 0; padding: 0; list-style: none; }
	.target li { display: flex; gap: 12px; font-weight: 600; line-height: 1.55; white-space: nowrap; }
	.target li .pts { width: 1.2em; flex: none; text-align: right; color: var(--epic); font-variant-numeric: tabular-nums; }
	.target li .name { overflow: hidden; text-overflow: ellipsis; }
	.target li.more { font-weight: 400; color: var(--muted); }
	svg { margin-top: 8px; }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
// Shows anything that goes wrong below on the card, so a bad history file doesn't just leave it blank.
window.onerror = (message) => {
	document.getElementById("card").innerHTML = `<div class="title">Epic history</div><div class="sub" style="margin-top:6px">${escape(String(message))}</div>`;
};

const HISTORY = __DATA__;
document.body.dataset.style = HISTORY.style || "glass";
// Lua's JSON encoder writes an empty list as {}.
const days = Array.isArray(HISTORY.days) ? HISTORY.days : [];
const catchUpTickets = Array.isArray(HISTORY.catchUp) ? HISTORY.catchUp : [];

const latest = days.at(-1);
const previous = days.at(-2);
// The epic widget keeps rewriting today's figure until the day ends, so it isn't an end-of-day one yet.
const latestIsToday = latest?.date === HISTORY.today;
const clearingToday = latestIsToday && catchUpTickets.length > 0;

const card = document.getElementById("card");
// The chart fills the card, which is as wide as the window epic_history.lua opens.
const chartWidth = card.clientWidth - 2 * parseFloat(getComputedStyle(card).paddingLeft);
const CHART_TEXT = 18;

// Drawn once to see how much height is left, then again with the chart taking all of it.
draw(150);
if (days.length) draw(Math.max(110, 150 + spareHeight()));

function draw(chartHeight) {
	card.innerHTML = days.length
		? `<div class="content"><div><div class="title">${escape(HISTORY.title)}</div>${headline()}</div>${doneToday()}${catchUp()}${chart(chartHeight)}</div>`
		: `<div class="content"><div class="title">${escape(HISTORY.title)}</div><div class="sub">No days recorded yet.</div></div>`;
}

/** The card's height not taken up by its content; below zero when the content doesn't fit. */
function spareHeight() {
	const style = getComputedStyle(card);
	const inner = card.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
	return inner - card.firstElementChild.offsetHeight;
}

/**
 * When short today, what to get done today, as the epic widget already leads with the finish date
 * and how far short that is. Otherwise how far ahead or short the epic is.
 */
function headline() {
	const when = latestIsToday ? "today so far" : `end of ${fmt(latest.date)}`;
	const big = clearingToday ? `${catchUpPoints()} pts to clear today` : `${verdict(latest.daysAhead)}${points(latest)}`;
	const sub = clearingToday ? `${verdict(latest.daysAhead)} ${when}` : when;
	return `<div class="big" style="color:${colour(latest.daysAhead)}">${big}</div>
		<div class="sub">${sub}${previous ? ` · ${trend(latest.daysAhead - previous.daysAhead)} since ${fmt(previous.date)}` : ""}</div>`;
}

/**
 * Points that reached Ready for Testing or further today, against two targets: a day's worth, which
 * keeps the epic as far ahead or short as it was, and the pace that would finish the must-haves by
 * the due date if they were spread evenly from today. Needs yesterday's total complete to compare with.
 */
function doneToday() {
	const before = previous?.pointsComplete;
	if (!latestIsToday || before == null || latest.pointsComplete == null) return "";
	// A finished ticket leaving the epic lowers the total, which isn't negative progress.
	const done = Math.max(0, latest.pointsComplete - before);
	// The points left as they were this morning, so the pace doesn't drop as today's tickets get done.
	const onTimePace = HISTORY.workingDaysLeft ? (HISTORY.mustPointsLeft + done) / HISTORY.workingDaysLeft : null;
	return `<div class="rows">${progressRow("Day's worth", done, HISTORY.pointsPerDay)}${progressRow("To hit due", done, onTimePace)}</div>`;
}

function progressRow(label, done, target) {
	if (!target) return "";
	const fill = Math.min(1, done / target) * 100;
	return `<div class="today">
		<span class="sub label">${label}</span>
		<span class="bar"><i style="width:${fill}%;${done >= target ? "background:var(--good)" : ""}"></i></span>
		<b>${done} of ${r1(target)} pts</b>
	</div>`;
}

/**
 * When short, the tickets, in work order, to get to Ready for Testing today for tomorrow to start on
 * track. Past maxRows, the last row says how many more there are.
 */
function catchUp() {
	if (!catchUpTickets.length) return "";
	const count = catchUpTickets.length;
	const maxRows = HISTORY.maxRows || count;
	const shown = count > maxRows ? catchUpTickets.slice(0, maxRows - 1) : catchUpTickets;
	const rows = shown.map((t) => `<li><span class="pts">${t.points ?? ""}</span><span class="name">${escape(t.title)}</span></li>`).join("");
	const more = count > shown.length ? `<li class="more"><span class="pts"></span><span class="name">and ${count - shown.length} more</span></li>` : "";
	return `<div class="target">
		<div class="sub">To Ready for Testing today to catch up</div>
		<ul>${rows}${more}</ul>
	</div>`;
}

/** One point per recorded working day, evenly spaced, against a zero line for "on target". */
function chart(H) {
	const W = chartWidth, fs = CHART_TEXT, pad = { l: 2.6 * fs, r: 10, t: fs + 10, b: fs + 12 };
	const values = days.map((d) => d.daysAhead);
	// Always includes zero, and at least a day either way, so a flat run doesn't fill the whole height.
	const top = Math.max(0, ...values) + 0.5;
	const bottom = Math.min(0, ...values) - 0.5;
	const x = (i) => pad.l + (days.length === 1 ? 0.5 : i / (days.length - 1)) * (W - pad.l - pad.r);
	const y = (v) => pad.t + ((top - v) / (top - bottom)) * (H - pad.t - pad.b);
	const path = (indexes) => indexes.map((i, n) => `${n ? "L" : "M"}${x(i)},${y(days[i].daysAhead)}`).join("");
	// The line into today's point is dashed, as today's figure can still change.
	const lastSettled = latestIsToday ? days.length - 2 : days.length - 1;
	const settled = path(days.map((_, i) => i).slice(0, lastSettled + 1));
	const provisional = latestIsToday && previous ? path([days.length - 2, days.length - 1]) : "";

	const gridValues = [...new Set([Math.ceil(top - 0.5), 0, Math.floor(bottom + 0.5)])];
	const grid = gridValues.map((v) => `
		<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? "var(--muted)" : "var(--faint)"}" stroke-opacity="${v === 0 ? 0.5 : 1}"/>
		<text x="${pad.l - 6}" y="${y(v) + fs / 3}" fill="var(--muted)" font-size="${fs}" text-anchor="end">${v > 0 ? `+${v}` : v}d</text>`).join("");

	// Labels the first and last day, and one in the middle once there are enough days to fit it.
	const labelled = [...new Set([0, days.length >= 5 ? Math.floor((days.length - 1) / 2) : 0, days.length - 1])];
	const ticks = labelled.map((i) => `<text x="${x(i)}" y="${H - 4}" fill="var(--muted)" font-size="${fs}" text-anchor="${tickAnchor(i)}">${i === days.length - 1 && latestIsToday ? "today" : fmt(days[i].date)}</text>`).join("");

	const dots = days.map((d, i) => {
		const last = i === days.length - 1;
		return `<circle cx="${x(i)}" cy="${y(d.daysAhead)}" r="${last ? 6.5 : 4.5}" fill="${last ? colour(d.daysAhead) : "var(--epic)"}"/>`;
	}).join("");

	// Each label is about 2.5 characters' worth wide, so with many days only every 2nd, 3rd, ... day
	// gets one, counting back from the latest so that one is always labelled.
	const labelEvery = Math.ceil(days.length / Math.floor((W - pad.l - pad.r) / (2.5 * fs)));
	const valueLabels = days.map((d, i) => {
		if ((days.length - 1 - i) % labelEvery !== 0) return "";
		// Above the dot, unless that would run off the top of the chart.
		const labelY = y(d.daysAhead) - 12 < fs ? y(d.daysAhead) + fs + 10 : y(d.daysAhead) - 12;
		return `<text x="${x(i)}" y="${labelY}" fill="var(--text)" font-size="${fs}" font-weight="600" text-anchor="${tickAnchor(i)}">${signed(r1(d.daysAhead))}</text>`;
	}).join("");

	return `<div><div class="sub">Days ahead or short at the end of each day</div><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
		${grid}
		<path d="${settled}" stroke="var(--epic)" stroke-width="3" fill="none" stroke-linejoin="round"/>
		<path d="${provisional}" stroke="var(--epic)" stroke-width="3" stroke-dasharray="4 4" fill="none"/>
		${dots}
		${valueLabels}
		${ticks}
	</svg></div>`;

	function tickAnchor(i) {
		if (days.length === 1) return "middle";
		return i === 0 ? "start" : i === days.length - 1 ? "end" : "middle";
	}
}

/** Rounds to one decimal place like the epic widget; toFixed(2) first stops float noise (2.9500000001) rounding up. */
function r1(n) {
	return Math.round(Number(n.toFixed(2)) * 10) / 10;
}

/** A number with its sign, e.g. "+1.5" or "-2.9". */
function signed(n) {
	return n > 0 ? `+${n}` : String(n);
}

function verdict(daysAhead) {
	const rounded = r1(daysAhead);
	if (rounded === 0) return "On target";
	return rounded > 0 ? `${rounded}d ahead` : `${-rounded}d short`;
}

/** The day's figure in points, rounded the same way as the epic widget. */
function points(day) {
	if (day.pointsAhead == null || r1(day.daysAhead) === 0) return "";
	if (day.pointsAhead > 0) return `<span class="points">· ${Math.floor(day.pointsAhead)} pts spare</span>`;
	return `<span class="points">· ${Math.ceil(-day.pointsAhead)} pts behind</span>`;
}

/**
 * Today's shortfall in points, from the catch-up tickets rather than the history file's average days
 * per point, as the next tickets in the queue can cost more or fewer days per point than the average.
 */
function catchUpPoints() {
	return catchUpTickets.reduce((total, t) => total + (t.points || 0), 0);
}

/** How the figure moved: up means catching up, down means falling further behind. */
function trend(change) {
	const rounded = r1(change);
	if (rounded === 0) return "no change";
	return rounded > 0 ? `▲ ${rounded}d caught up` : `▼ ${-rounded}d lost`;
}

/** The same thresholds as the epic widget: green from half a day ahead, amber down to two days short, red past that. */
function colour(daysAhead) {
	if (daysAhead >= 0.5) return "var(--good)";
	return daysAhead > -2 ? "var(--warn)" : "var(--bad)";
}

function fmt(iso) {
	const [y, m, d] = iso.split("-").map(Number);
	return new Date(y, m - 1, d).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
}

function escape(text) {
	return text.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}
</script>
</body>
</html>
